<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페인 수혈 지도</title>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=efddfb39f59d8f50b40de5655470573d&libraries=services"></script>
    <style>
        /* 아늑한 카페 & 커피 테마 컬러 정의 */
        :root {
            --cafe-roast: #6F4E37;      /* 진한 에스프레소 브라운 */
            --cafe-latte: #C19A6B;      /* 부드러운 라떼 브라운 */
            --cafe-cream: #FDFBF7;      /* 따뜻하고 편안한 크림 아이보리 */
            --cafe-rest: #A3B19B;       /* 휴식을 주는 차분한 말차 그린 */
            --cafe-border: #E6DCD2;     /* 부드러운 베이지 톤 테두리 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--cafe-cream);
            color: #333;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 사이드바 */
        .sidebar {
            width: 380px;
            height: 100%;
            background: #FAF6F0;
            border-right: 5px solid var(--cafe-latte);
            display: flex;
            flex-direction: column;
            padding: 25px;
            z-index: 10;
            box-shadow: 5px 0 15px rgba(111, 78, 55, 0.1);
        }

        .search-box h2 {
            color: var(--cafe-roast);
            font-size: 24px;
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 1px 1px 0px #fff, 2px 2px 0px var(--cafe-border);
        }

        .search-box input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--cafe-latte);
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
            background-color: #fff;
        }

        .search-box input:focus {
            border-color: var(--cafe-roast);
            box-shadow: 0 0 10px rgba(111, 78, 55, 0.2);
        }

        /* 탭 스타일 */
        .tab-container {
            display: flex;
            margin-top: 15px;
            background: #EEF2E6;
            padding: 4px;
            border-radius: 8px;
        }

        .tab-button {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: bold;
            color: #777;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        .tab-button.active {
            background: var(--cafe-roast);
            color: #fff;
        }

        /* 결과 리스트 스타일 */
        #resultList {
            flex-grow: 1;
            margin-top: 15px;
            overflow-y: auto;
            list-style: none;
        }

        .result-item {
            padding: 15px;
            margin-bottom: 10px;
            background: #fff;
            border: 1px solid var(--cafe-border);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .result-item:hover {
            background-color: var(--cafe-rest);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .result-item strong {
            display: block;
            margin-bottom: 5px;
            color: inherit;
        }
        
        .result-item small {
            color: #666;
        }
        .result-item:hover small {
            color: #eeeeee;
        }

        /* 오른쪽 지도 */
        #map {
            flex-grow: 1;
            height: 100%;
        }

        /* 스크롤바 커스텀 */
        #resultList::-webkit-scrollbar {
            width: 6px;
        }
        #resultList::-webkit-scrollbar-thumb {
            background: var(--cafe-latte);
            border-radius: 10px;
        }

        /* 이모지 마커 스타일 컴포넌트 */
        .emoji-marker {
            font-size: 28px;
            text-align: center;
            user-select: none;
            cursor: pointer;
            filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.3));
            animation: bounce 0.4s ease-out;
        }

        /* 말풍선(인포윈도우) 커스텀 스타일 */
        .custom-overlay {
            background: white;
            border: 2px solid var(--cafe-latte);
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
            bottom: 45px; /* 핀 위에 예쁘게 띄우기 위함 */
            min-width: 180px;
        }
        .custom-overlay::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }
        .custom-overlay h4 {
            font-size: 14px;
            color: var(--cafe-roast);
            margin-bottom: 4px;
        }
        .custom-overlay p {
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
        }
        .custom-overlay a {
            display: inline-block;
            font-size: 11px;
            color: white;
            background: var(--cafe-latte);
            padding: 3px 8px;
            border-radius: 4px;
            text-decoration: none;
        }
        .custom-overlay a:hover {
            background: var(--cafe-roast);
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="search-box">
            <h2>☕ 카페인 수혈 지도 🌿</h2>
            <input type="text" id="keyword" placeholder="지금 필요한 커피나 카페를 검색해봐!">
        </div>
        
        <div class="tab-container">
            <button class="tab-button active" onclick="switchTab('brand')">브랜드 커피숍</button>
            <button class="tab-button" onclick="switchTab('private')">개인 커피숍</button>
        </div>

        <ul id="resultList"></ul>
    </div>
    <div id="map"></div>
</div>

<script>
    let map;
    let markers = [];         // 생성된 모든 마커를 저장할 배열
    let activeOverlay = null; // 현재 지도에 열려있는 말풍선 객체 저장 변수
    let currentTab = 'brand'; 
    let rawSearchData = [];   

    const brandKeywords = ['스타벅스', '메가커피', '이디야', '더벤티', '빽다방', '할리스', '컴포즈', '투썸', '폴바셋'];

    kakao.maps.load(function() {
        initMap();
    });

    function initMap() {
        const mapContainer = document.getElementById('map');
        const mapOption = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567),
            level: 5
        };

        map = new kakao.maps.Map(mapContainer, mapOption);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                map.setCenter(new kakao.maps.LatLng(lat, lon));
            });
        }
    }

    // 기존에 지도에 그려진 모든 마커와 말풍선 지우기
    function clearMarkers() {
        markers.forEach(m => m.setMap(null));
        markers = [];
        if (activeOverlay) {
            activeOverlay.setMap(null);
            activeOverlay = null;
        }
    }

    function switchTab(tabType) {
        currentTab = tabType;
        
        const buttons = document.querySelectorAll('.tab-button');
        buttons[0].classList.toggle('active', tabType === 'brand');
        buttons[1].classList.toggle('active', tabType === 'private');

        if (rawSearchData.length > 0) {
            displayFilteredResults();
        }
    }

    function displayFilteredResults() {
        const listEl = document.getElementById('resultList');
        listEl.innerHTML = ''; 
        clearMarkers(); // 새 탭 누를 때 기존 핀 싹 청소

        const bounds = new kakao.maps.LatLngBounds();
        let displayCount = 0;

        rawSearchData.forEach(place => {
            const isBrand = brandKeywords.some(brand => place.place_name.includes(brand));

            if (currentTab === 'brand' && !isBrand) return;
            if (currentTab === 'private' && isBrand) return;

            displayCount++;

            // 1. 리스트 아이템 추가
            const itemEl = document.createElement('li');
            itemEl.className = 'result-item';
            
            // 리스트 왼쪽에 매칭되는 이모지 붙여주기
            const currentEmoji = isBrand ? '☕' : '🧋';
            itemEl.innerHTML = `<strong>${currentEmoji} ${place.place_name}</strong><small>${place.address_name}</small>`;
            
            const placePos = new kakao.maps.LatLng(place.y, place.x);

            // 2. 카카오 지도 커스텀 이모지 핀(CustomOverlay 방식) 생성
            const markerContent = document.createElement('div');
            markerContent.className = 'emoji-marker';
            markerContent.innerText = currentEmoji;

            const customMarker = new kakao.maps.CustomOverlay({
                position: placePos,
                content: markerContent,
                clickable: true
            });

            customMarker.setMap(map);
            markers.push(customMarker); // 마커 관리 배열에 저장

            // 3. 핀을 클릭했을 때 나타날 장소 설명 말풍선 디자인 정의
            const infoContent = `
                <div class="custom-overlay">
                    <h4>${place.place_name}</h4>
                    <p>${place.address_name}</p>
                    <a href="https://place.map.kakao.com/${place.id}" target="_blank">상세정보 보기</a>
                </div>
            `;

            const infoOverlay = new kakao.maps.CustomOverlay({
                position: placePos,
                content: infoContent,
                yAnchor: 1
            });

            // 핀 클릭 시 말풍선 띄우는 함수
            function openInfoWindow() {
                if (activeOverlay) activeOverlay.setMap(null); // 기존에 열린게 있으면 닫기
                infoOverlay.setMap(map);
                activeOverlay = infoOverlay; // 현재 열린 말풍선으로 기록
                map.panTo(placePos); // 화면을 부드럽게 중심 이동
            }

            // 마커 클릭 이벤트 연동
            markerContent.onclick = function() {
                openInfoWindow();
            };

            // 왼쪽 리스트 클릭 시 이벤트 연동
            itemEl.onclick = function() {
                openInfoWindow();
            };

            listEl.appendChild(itemEl);
            bounds.extend(placePos);
        });

        if (displayCount > 0) {
            map.setBounds(bounds);
        } else {
            listEl.innerHTML = `<li style="text-align:center; padding:20px; color:#999; font-size:14px;">이 지역에는 해당되는 커피숍이 없어... ☕</li>`;
        }
    }

    document.getElementById('keyword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const ps = new kakao.maps.services.Places();
            let searchKeyword = this.value.trim();

            if (!searchKeyword) {
                alert('검색어를 입력해줘! ☕');
                return;
            }

            if(!searchKeyword.endsWith('카페') && !searchKeyword.endsWith('커피숍')) {
                searchKeyword += ' 카페';
            }

            ps.keywordSearch(searchKeyword, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    rawSearchData = data; 
                    displayFilteredResults(); 
                } else {
                    alert('검색 결과가 없어... ☕ 다른 지역을 찾아볼까?');
                }
            });
        }
    });
</script>

</body>
</html>
